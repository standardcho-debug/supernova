<title>코파운더 마케팅 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef2f6; --ink:#121826; --muted:#5b6474; --faint:#8b93a3;
  --line:#e1e6ed; --accent:#0c8a67; --accent-strong:#08704f; --accent-soft:#dff3eb; --on-accent:#ffffff;
  --navy:#0f1b33; --warn:#9a5d06; --warn-soft:#fcefd6; --danger:#c23f37; --danger-soft:#fbe5e3;
  --info:#3456c4; --info-soft:#e5ebfb; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1020; --surface:#111a2c; --surface-2:#0d1526; --ink:#e7ecf4; --muted:#9aa4b6; --faint:#6f7a8e;
    --line:rgba(255,255,255,.09); --accent:#3cc99c; --accent-strong:#5ad8b0; --accent-soft:rgba(60,201,156,.13); --on-accent:#05251b;
    --navy:#0f1b33; --warn:#e9ad52; --warn-soft:rgba(233,173,82,.12); --danger:#ff7b72; --danger-soft:rgba(255,123,114,.12);
    --info:#8aa6ff; --info-soft:rgba(138,166,255,.13); --shadow:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1020; --surface:#111a2c; --surface-2:#0d1526; --ink:#e7ecf4; --muted:#9aa4b6; --faint:#6f7a8e;
  --line:rgba(255,255,255,.09); --accent:#3cc99c; --accent-strong:#5ad8b0; --accent-soft:rgba(60,201,156,.13); --on-accent:#05251b;
  --navy:#0f1b33; --warn:#e9ad52; --warn-soft:rgba(233,173,82,.12); --danger:#ff7b72; --danger-soft:rgba(255,123,114,.12);
  --info:#8aa6ff; --info-soft:rgba(138,166,255,.13); --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14.5px;line-height:1.6}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px}
.mark{display:flex;align-items:center;gap:9px;margin-right:auto}
.mark .dot{width:22px;height:22px;border-radius:7px;background:var(--navy);position:relative;flex:0 0 auto}
.mark .dot::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;border-radius:50%;background:#3cc99c}
.mark b{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.ws-switch{display:flex;gap:6px;align-items:center}
select.inp{padding:6px 10px}

.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.nav{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px}
.nav button{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;color:var(--ink)}
.nav button .n{grid-row:span 2;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.nav button .l{font-weight:600;font-size:14px}
.nav button .s{font-size:11.5px;color:var(--faint)}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--surface);box-shadow:var(--shadow)}
.nav button.on .n{background:var(--accent);color:var(--on-accent)}
.nav button.done .n{background:var(--accent-soft);color:var(--accent)}
.nav button:disabled{opacity:.45;cursor:not-allowed}
.nav .hint{margin-top:14px;padding:12px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:6px}
.card > p.lead{margin:0 0 12px;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:10px}

.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);min-width:0}
.inp:focus{background:var(--surface);border-color:var(--accent)}
textarea.inp{resize:vertical;line-height:1.55}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13.5px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.soft:hover{filter:brightness(.97)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--danger)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);position:relative}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.rec:not(.on){border-color:var(--info);border-style:dashed}
.chip .rec-tag{font-size:10px;font-weight:700;color:var(--info);margin-left:4px}
.chip.on .rec-tag{color:inherit;opacity:.8}

.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset;background:var(--accent-soft)}
.choice b{display:block;font-size:14px}
.choice span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.choice .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

.progress{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .cnt{font-size:11px;color:var(--faint);margin-left:4px;font-weight:500}

.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.field.filled{border-left:3px solid var(--accent)}
.field header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.field h3{font-size:15px}
.field .why{font-size:12px;color:var(--info);margin:2px 0 0}
.field .q{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.src{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.src.input{background:var(--surface-2);color:var(--muted)}
.src.ai{background:var(--info-soft);color:var(--info)}
.src.cofounder{background:var(--accent-soft);color:var(--accent)}
.src-ref{font-size:11px;color:var(--faint);margin-left:6px}
.list-edit{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.list-edit li{display:flex;gap:6px;align-items:center}
.list-edit li .inp{flex:1}
.add-row{display:flex;gap:6px}
.sugs{margin-top:10px;padding:10px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.sugs .sugs-label{font-size:11.5px;font-weight:700;color:var(--muted)}
.sug{text-align:left;border:1px dashed var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.sug:hover{border-color:var(--accent);border-style:solid}
.sug::before{content:"+";font-weight:700;color:var(--accent)}
.sug .src{margin-left:auto}
.field-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.pal{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.pal:hover{border-color:var(--accent)}
.pal .sw{display:flex;border-radius:6px;overflow:hidden;height:26px;width:120px}
.pal .sw i{flex:1}
.pal span{font-size:11.5px;color:var(--muted)}
.color-row{display:flex;gap:14px;flex-wrap:wrap}
.color-row label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.color-row input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}

.callout{border-radius:12px;padding:12px 14px;font-size:13px;background:var(--info-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-soft)}
.callout.ok{background:var(--accent-soft)}
.callout b{white-space:nowrap}

.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.asset .thumb{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.asset .thumb img,.asset .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.asset .body{padding:8px;display:flex;flex-direction:column;gap:6px}
.asset .body .inp{padding:6px 8px;font-size:12.5px}
.need-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.need-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:13px}
.need-list li .st{flex:0 0 auto}

.brief-list{display:flex;flex-direction:column;gap:8px}
.brief-item{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--ink)}
.brief-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.brief-item b{display:block}
.brief-item .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.step-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}

.two-col{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.slide-grid canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.slide-edit{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.slide-edit .no{font-weight:700;color:var(--faint);padding-top:8px}
.slide-edit .inp{margin-bottom:6px}
.counter{font-size:11.5px;color:var(--faint)}
.counter.over{color:var(--danger);font-weight:700}
.copy-box{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.copy-box.mono{font-size:12px}
.copy-box .btn{position:absolute;top:8px;right:8px}
.copy-box.pad-r{padding-right:74px}
.scene-table{width:100%;border-collapse:collapse;font-size:13px}
.scene-table th,.scene-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.scene-table th{font-size:12px;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto}
.ad-preview{width:100%;max-width:360px;border-radius:10px;border:1px solid var(--line);display:block}

.yn{display:flex;gap:8px}
.yn button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700;color:var(--ink)}
.yn button.on.yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.yn button.on.no{background:var(--danger);border-color:var(--danger);color:#fff}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.metric-grid label{font-size:11.5px;color:var(--muted)}
.metric-grid .inp{padding:6px 8px;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;background:rgba(8,14,28,.45);z-index:50;display:grid;place-items:center;padding:16px}
.overlay .box{background:var(--surface);border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.spinner{width:30px;height:30px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--danger)}
.preview-banner{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 20px;text-align:center}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.cf-doc{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.cf-doc:hover{border-color:var(--accent)}
.cf-doc .snip{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll-box{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.insight{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}

/* ---- channel preview ---- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.preview-card{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.preview-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.linkbtn{border:0;background:none;padding:0;color:var(--info);font-weight:600;text-decoration:underline;font-size:inherit}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:9px;background:var(--surface-2)}
.checks li i{font-style:normal;font-weight:800;flex:0 0 18px;text-align:center}
.checks li.ok i{color:var(--accent)} .checks li.warn i{color:var(--warn)} .checks li.bad i{color:var(--danger)}
.phone{--ig-ink:#0f1419;--ig-sub:#737373;--ig-line:#dbdbdb;background:#ffffff;color:var(--ig-ink);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 8px 30px rgba(16,24,40,.12);font-family:-apple-system,'Apple SD Gothic Neo','IBM Plex Sans KR',sans-serif;font-size:13.5px;max-width:380px;width:100%}
.ig-top{display:flex;align-items:center;gap:9px;padding:10px 12px}
.ig-av{width:32px;height:32px;border-radius:50%;background:#eef2f6;border:1px solid var(--ig-line);object-fit:contain;flex:0 0 auto}
.ig-top b{font-size:13.5px;display:block;line-height:1.2}
.ig-top small{font-size:11.5px;color:var(--ig-sub)}
.ig-top .more{margin-left:auto;color:var(--ig-ink);font-weight:700;letter-spacing:1px}
.ig-media{position:relative;background:#f1f1f1;aspect-ratio:4/5}
.ig-media canvas{width:100%;height:100%;display:block}
.ig-nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ig-nav.prev{left:8px} .ig-nav.next{right:8px}
.ig-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;border-radius:999px;padding:2px 8px}
.ig-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f5f7fa;border-bottom:1px solid var(--ig-line)}
.ig-cta b{display:block;font-size:13px;line-height:1.3}
.ig-cta small{color:var(--ig-sub);font-size:11.5px}
.ig-cta span.cta{flex:0 0 auto;background:#0095f6;color:#fff;font-weight:700;font-size:12.5px;border-radius:8px;padding:6px 12px}
.ig-actions{display:flex;gap:14px;padding:9px 12px 4px;align-items:center}
.ig-actions svg{width:24px;height:24px;fill:none;stroke:var(--ig-ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ig-actions .sp{margin-left:auto}
.ig-dots{display:flex;gap:4px;justify-content:center;flex:1}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}
.ig-dots i.on{background:#0095f6}
.ig-cap{padding:2px 12px 12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.ig-cap .tag{color:#00376b}
.ig-cap .more-btn{border:0;background:none;padding:0;color:var(--ig-sub);font-size:inherit}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind){ S.toast = {msg, kind}; renderToast(); clearTimeout(toast._t); toast._t = setTimeout(() => { S.toast = null; renderToast(); }, 3600); }
function renderToast(){
  let el = document.getElementById('toast');
  if (!S.toast) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }

/* ============================ persistence ============================ */
const saveTimers = {}; const saveChains = {};
function saveDoc(path, data){
  if (!S.caps.db) { delete S.dirty[path]; return Promise.resolve(); }
  const payload = clone(data);
  S.dirty[path] = true;
  saveChains[path] = (saveChains[path] || Promise.resolve())
    .then(() => S.caps.db.doc(path).set(payload))
    .catch(e => toast(dbErr(e), 'err'))
    .finally(() => { if (!saveTimers[path]) delete S.dirty[path]; });
  return saveChains[path];
}
function saveLater(path, getter, ms = 700){
  S.dirty[path] = true;
  clearTimeout(saveTimers[path]);
  saveTimers[path] = setTimeout(() => { saveTimers[path] = null; saveDoc(path, getter()); }, ms);
}
function delDoc(path){ if (S.caps.db) S.caps.db.doc(path).delete().catch(e => toast(dbErr(e), 'err')); }
function isDirty(prefix){ return Object.keys(S.dirty).some(k => k.startsWith(prefix)); }
function dbErr(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return '저장 권한이 없거나 데이터 형식이 맞지 않습니다.';
  if (c === 'quota_exceeded') return '저장 공간이 가득 찼습니다. 오래된 브리프를 정리해주세요.';
  if (c === 'resource_exhausted') return '저장 요청이 많습니다. 잠시 후 다시 시도해주세요.';
  return '저장하지 못했습니다. 잠시 후 다시 시도해주세요.';
}
const saveBrand = () => { if (!S.wsId) return; S.brand.updated_at = now(); saveLater(P.brand(S.wsId), () => S.brand); };
const saveWs = () => { if (!S.wsId || !S.ws) return; S.ws.updated_at = now(); saveLater(P.ws(S.wsId), () => stripId(S.ws)); };
const saveBrief = b => saveLater(P.brief(S.wsId, b.id), () => stripId(b));
const savePack = p => saveLater(P.pack(S.wsId, p.id), () => stripId(p));
const stripId = o => { const c = clone(o); delete c.id; return c; };

let subs = [];
function subscribeWs(id){
  subs.forEach(u => { try { u(); } catch (e) {} }); subs = [];
  S.brand = emptyBrand(); S.assets = []; S.briefs = []; S.packs = {}; S.ctx = null;
  const db = S.caps.db; if (!db) return;
  subs.push(db.doc(P.brand(id)).onSnapshot(s => { if (s.exists && !isDirty(P.brand(id))) applyRemote('brand', normalizeBrand(clone(s.data()))); }, () => {}));
  subs.push(db.doc(P.ctx(id)).onSnapshot(s => { applyRemote('ctx', s.exists ? clone(s.data()) : null); }, () => {}));
  subs.push(db.collection(`workspaces/${id}/assets`).onSnapshot(q => { if (!isDirty(`workspaces/${id}/assets`)) applyRemote('assets', q.docs.map(d => ({id:d.id, ...clone(d.data())})).sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''))); }, () => {}));
  subs.push(db.collection(`workspaces/${id}/briefs`).onSnapshot(q => { if (!isDirty(`workspaces/${id}/briefs`)) applyRemote('briefs', q.docs.map(d => ({id:d.id, ...clone(d.data())})).sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''))); }, () => {}));
  subs.push(db.collection(`workspaces/${id}/packs`).onSnapshot(q => { if (isDirty(`workspaces/${id}/packs`)) return; const m = {}; q.docs.forEach(d => { m[d.id] = {id:d.id, ...clone(d.data())}; }); applyRemote('packs', m); }, () => {}));
}
function applyRemote(key, val){ if (JSON.stringify(S[key]) === JSON.stringify(val)) return; S[key] = val; render(); }
function normalizeBrand(b){ const e = emptyBrand(); return Object.assign(e, b || {}, {v:(b && b.v) || {}, sug:(b && b.sug) || {}}); }
function selectWs(id){
  S.wsId = id; S.ws = S.workspaces.find(w => w.id === id) || null; lsSet('mk_ws', id);
  S.briefId = null; S.draft = null; S.reviewId = null; S.reviewDraft = null; S.cf = {step:'idle', clients:[], slug:'', docs:[], sel:{}, error:null};

function viewCofounder(){

    body += `<div class="row"><label class="lbl" for="cf-client" style="margin:0">가져올 고객사</label>
      <select class="inp" id="cf-client" data-change="cfPick" style="max-width:320px"><option value="">선택하세요</option>${sorted.map(c => `<option value="${esc(c.slug)}" ${c.slug === cf.slug ? 'selected' : ''}>${esc(c.name)} · ${esc(c.slug)}${c.phase === 'live' ? ' (운영 중)' : ''}</option>`).join('')}</select>

      : '<div class="empty">이 고객사에는 아직 문서가 없습니다.</div>';

  return `<section class="card stack"><h2>코파운더 데이터 가져오기</h2>${body}</section>`;

    editor = `<ul class="list-edit">${(v || []).map((it, i) => `<li><input class="inp" id="bl-${f.key}-${i}" data-bl="${f.key}" data-i="${i}" value="${esc(it.t)}" aria-label="${esc(f.label)} ${i + 1}">${it.src ? `<span class="src-ref">${esc(it.src)}</span>` : ''}${srcBadge(it.s)}<button class="icon-btn" data-act="listDel" data-key="${f.key}" data-i="${i}" aria-label="삭제">×</button></li>`).join('')}</ul>

      ${sug.length ? `<div class="sugs"><span class="sugs-label">추천 팔레트 — 눌러서 적용</span><div class="swatches">${sug.map((pl, i) => `<button class="pal" data-act="palette" data-i="${i}"><span class="sw"><i style="background:${esc(pl.main)}"></i><i style="background:${esc(pl.sub)}"></i><i style="background:${esc(pl.accent)}"></i></span><span>${esc(pl.name || '')}</span></button>`).join('')}</div></div>` : ''}`;

    </div></section>`;

  if (dz) {
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');

  document.querySelectorAll('canvas[data-slide]').forEach(cv => { const i = +cv.dataset.slide; if (seq === drawSeq) drawSlide(cv, {slide: slides[i] || {}, idx: i, total: slides.length, bg: slideBg(pack, i)}); });

  document.querySelectorAll('canvas[data-ad-canvas],canvas[data-mock-ad]').forEach(cv => drawAd(cv, adSpec(pack)));
  document.querySelectorAll('canvas[data-cover-canvas]').forEach(cv => drawCover(cv, coverSpec(pack)));

function applyDraft(r){
  const sg = {};
  const toItems = arr => (arr || []).map(x => typeof x === 'string' ? {t: x, s: /코파운더/.test(x) ? 'cofounder' : 'ai'} : {t: x.t || '', src: x.src && x.src !== '코파운더' ? x.src : '', s: /코파운더/.test(x.src || '') ? 'cofounder' : 'ai'}).filter(x => x.t);
  ['offer','reasons','proof','persona','pains','objections','customer_words','voice_examples','banned','visual_dont','references'].forEach(k => { if (r[k]) sg[k] = toItems(r[k]); });
  if (r.tone) sg.tone = r.tone.filter(x => TONES.includes(x));
  if (r.mood) sg.mood = r.mood.filter(x => MOODS.includes(x));
  if (r.post_goal && POST_GOALS.includes(r.post_goal)) sg.post_goal = [r.post_goal];
  if (Array.isArray(r.colors)) sg.colors = r.colors.filter(c => /^#[0-9a-f]{6}$/i.test(c.main || '') && /^#[0-9a-f]{6}$/i.test(c.sub || '') && /^#[0-9a-f]{6}$/i.test(c.accent || '')).slice(0, 3);
  S.brand.sug = sg;
  S.brand.needed = (r.needed_assets || []).filter(n => n && n.what).map(n => ({type: ASSET_TYPES.includes(n.type) ? n.type : '기타', what: n.what, why: n.why || ''}));
  S.brand.notes = r.notes || '';
}
async function fieldSug(key, mode){
  const f = FIELD[key];
  const existing = f.kind === 'list' ? (S.brand.v[key] || []).map(x => x.t) : f.kind === 'text' ? [T(key)] : [];
  const shape = f.kind === 'colors' ? '[{"name":"","main":"#RRGGBB","sub":"#RRGGBB","accent":"#RRGGBB"}] 3개'
    : f.kind === 'chips' ? `다음 보기 중에서만 고른 문자열 배열: ${f.options.join(', ')}`
    : key === 'proof' ? '[{"t":"사실","src":"근거"}] 4개' : '["..."] 5개';
  const src = mode === 'cofounder' ? `[코파운더 기록 인사이트 — 이것만 근거로 쓴다]\n${ctxText()}` : `[코파운더 기록 인사이트]\n${ctxText()}`;
  const prompt = `너는 한국 SNS 마케팅 대행사의 브랜드 플래너다. 브랜드킷의 "${f.label}" 항목(${f.q})에 넣을 추천을 만든다.
${RULES}
[브랜드킷 현재 상태]
${brandText()}
[소개 자료]
${((S.ws && S.ws.intro) || '(없음)').slice(0, 3000)}
${src}
이미 있는 값(겹치지 않게): ${existing.filter(Boolean).join(' / ') || '(없음)'}
형식: JSON 배열만. ${shape}${key === 'proof' ? ' 자료에 없으면 "확인 필요:"로.' : ''}`;
  const r = await ask(prompt, {label:`"${f.label}" 추천을 만드는 중`, tier: 'quick', fresh:true});
  if (!Array.isArray(r)) return;
  const s = mode === 'cofounder' ? 'cofounder' : 'ai';
  if (f.kind === 'colors') S.brand.sug.colors = r.filter(c => c && /^#[0-9a-f]{6}$/i.test(c.main || '')).slice(0, 3);
  else if (f.kind === 'chips') S.brand.sug[key] = r.filter(x => f.options.includes(x));
  else S.brand.sug[key] = r.map(x => typeof x === 'string' ? {t: x, s} : {t: x.t || '', src: x.src || '', s}).filter(x => x.t);
  saveBrand(); render();
}

    reels: `"reels":{"duration_sec":15~30 사이 숫자,"cover_text":"커버 문구(12자 이내)","music_mood":"음악 분위기","scenes":[{"sec":"0-2","visual":"화면에 보이는 것","asset":"자산 라이브러리 이름과 정확히 같은 값, 없으면 '촬영 필요: 무엇을'","on_screen":"화면 자막(한 줄 14자 이내)","voiceover":"내레이션 또는 빈 문자열"}],"capcut_steps":["CapCut에서 할 일 순서 6~9개(9:16, 자막, 전환, 음악, 내보내기 포함)"],"gemini_video_prompt":"전환용 짧은 영상 생성 프롬프트(영문, 선택)"}`,
  }[b.format];
  const prompt = `너는 한국 인스타그램 광고대행사의 시니어 카피라이터 겸 크리에이티브 디렉터다. 대표가 한 번에 "이대로 올리자"고 할 소재를 만든다. 뻔한 광고 문구, 과장, 억지 유행어는 쓰지 않는다. 브랜드킷의 말투와 고객이 쓰는 말을 따른다.
${RULES}
[브랜드킷]
${brandText()}
[코파운더 기록 인사이트]
${ctxText()}
[자산 라이브러리] ${assetText()}
[브리프]
용도: ${labelOf(PURPOSES, b.purpose)} / 목표: ${labelOf(GOALS, b.goal)} / 포맷: ${labelOf(FORMATS, b.format)}
주제: ${b.topic}
관점: ${b.angle || ''}
오퍼·CTA: ${b.offer || ''}
타겟: ${a.persona || ''} (인식 단계: ${a.awareness || ''})
핵심 메시지: ${a.key_message || ''}
근거: ${(a.proof || []).map(p => `${p.t} [${p.src}]`).join(' / ')}
훅 방향: ${(a.hooks || []).join(' / ')}
피할 것: ${(a.must_avoid || []).join(' / ')}
${fb ? `[이전 검수 피드백 — 반드시 고칠 것]\n${fb}` : ''}
${old && old.regen_note ? `[대표의 추가 요청]\n${old.regen_note}` : ''}
${old && old.data ? `[이전 버전 캡션 — 이걸 반복하지 말 것]\n${String(old.data.caption || '').slice(0, 600)}` : ''}

이미지 프롬프트 규칙: 영문으로, 피사체·구도·조명·렌즈·색감(브랜드 컬러 hex 포함)·무드를 구체적으로. 위쪽 35%는 한글 문구를 얹을 깨끗한 여백. 세로 4:5. 반드시 "no text, no letters, no logos, no watermark". 스톡 사진처럼 보이지 않게, 실제 한국 생활 장면처럼. 참고 자산이 있으면 "Use the attached photo as the reference for the product/scene"으로 시작.

아래 JSON 하나만 출력:
{"hooks":["첫 문장 후보 3개(각 25자 이내, 서로 다른 방식: 질문/반전/구체적 장면)"],"caption":"캡션. 첫 줄=hooks[0]. 짧은 문단, 줄바꿈. 마지막에 CTA 한 줄","hashtags":["#해시태그 8개(브랜드 1, 카테고리 3, 상황 4)"],"first_comment":"첫 댓글(선택, 없으면 빈 문자열)","alt_text":"대체 텍스트 1문장","ad":{"primary_text":"광고 기본 문구(125자 이내, 첫 문장에 핵심)","headline":"헤드라인(40자 이내)","description":"설명(30자 이내)","cta_button":"${CTA_BUTTONS.join('|')} 중 하나"},
 ${fmt}}`;
  const r = await ask(prompt, {label: old ? '피드백을 반영해 다시 만드는 중' : '소재를 만드는 중', fresh: true});
  if (!r) return;
  if (Array.isArray(r.slides)) r.slides = r.slides.slice(0, 7);
  const pack = {id: briefId, brief_id: briefId, format: b.format, gen: ((old && old.gen) || 0) + 1, data: r, hook: 0,
    template: (old && old.template) || 'solid', bg: (old && old.bg) || null, overlay: null, regen_note: '', reviews, publish: (old && old.publish) || null,
    created_at: (old && old.created_at) || now(), updated_at: now()};
  S.packs = {...S.packs, [briefId]: pack}; S.packTab = 'text';
  await saveDoc(P.pack(S.wsId, briefId), stripId(pack)); render();
  toast(`${pack.gen}번째 소재를 만들었습니다`);
}
async function uploadFiles(files){
  if (!S.caps.assets) { toast('업로드는 편집 권한이 있는 화면에서만 가능합니다', 'err'); return; }
  for (const f of files) {
    if (f.size > 20 * 1024 * 1024) { toast(`${f.name}: 20MB를 넘습니다. 짧게 자르거나 압축해주세요.`, 'err'); continue; }
    S.busy = {label:`${f.name} 올리는 중`}; render();
    try {
      const r = await S.caps.assets.upload(f);
      const id = uid(); const isV = (r.contentType || '').startsWith('video');
      const doc = {asset_id: r.id, name: f.name.replace(/\.[^.]+$/, ''), type: isV ? '인물·대표' : (/logo|로고/i.test(f.name) ? '로고' : '제품'), note:'', content_type: r.contentType, size: r.sizeBytes, created_at: now()};
      S.assets = [...S.assets, {id, ...doc}];
      await saveDoc(P.asset(S.wsId, id), doc);
    } catch (e) {
      const c = e && e.code;
      toast(c === 'too_large' ? `${f.name}: 파일이 너무 큽니다 (20MB 이하)` : c === 'unsupported_type' ? `${f.name}: 지원하지 않는 형식입니다` : c === 'quota_or_state' ? '저장 공간이 가득 찼습니다' : `${f.name}: 올리지 못했습니다`, 'err');
    }
  }
  S.busy = null; render();
}
async function uploadAiImage(file){
  if (!S.caps.assets) return;
  S.busy = {label:'이미지를 올리는 중'}; render();
  try {
    const r = await S.caps.assets.upload(file);
    const id = uid(); const b = briefById(S.briefId);
    const doc = {asset_id: r.id, name: `AI 이미지_${(b && b.topic || '').slice(0, 16)}`, type:'기타', note:'Gemini/ChatGPT로 생성', content_type: r.contentType, size: r.sizeBytes, created_at: now()};
    S.assets = [...S.assets, {id, ...doc}]; await saveDoc(P.asset(S.wsId, id), doc);
    const p = S.packs[S.briefId]; p.bg = r.id; touchPack(p, true);
  } catch (e) { toast('이미지를 올리지 못했습니다', 'err'); }
  S.busy = null; render();
}

/* ============================ events ============================ */
document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { copyFromKey(cp.dataset.copy, cp); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
function copyFromKey(k, btn){
  const p = S.packs[S.briefId] || {}; const d = p.data || {}; const fp = finalOf(p, 'prompts') || {}; const fv = finalOf(p, 'video') || {};
  const im = d.image || {}; const cv = d.cover_visual || {};
  const m = {gemini: fp.gemini_image || im.gemini_prompt || cv.gemini_prompt, chatgpt: fp.chatgpt_image || im.chatgpt_prompt || cv.chatgpt_prompt, gvideo:(d.reels || {}).gemini_video_prompt,
    subtitle: (timelineOf(p) || {scenes: []}).scenes.map(s => s.caption).filter(Boolean).join('\n'), shorts: `${(fv.shorts || {}).title || ''}\n\n${(fv.shorts || {}).description || ''}`};
  if (/^gv-\d+$/.test(k)) m[k] = ((fp.gemini_video || [])[+k.slice(3)] || {}).prompt;
  copyText(m[k] || '', btn);
}
document.addEventListener('input', e => {
  const el = e.target; const ds = el.dataset;
  if (ds.nw) { S.newWs[ds.nw] = el.value; return; }
  if (ds.ws) { S.ws[ds.ws] = el.value; saveWs(); return; }
  if (ds.bf) { S.brand.v[ds.bf] = {t: el.value, s: 'input'}; saveBrand(); return; }
  if (ds.bl) { const it = (S.brand.v[ds.bl] || [])[+ds.i]; if (it) { it.t = el.value; it.s = 'input'; saveBrand(); } return; }
  if (ds.color) { const c = S.brand.v.colors || {}; c[ds.color] = el.value; c.s = 'input'; S.brand.v.colors = c; saveBrand(); return; }
  if (ds.asset) { const a = S.assets.find(x => x.id === ds.asset); if (a) { a[ds.afield] = el.value; saveLater(P.asset(S.wsId, a.id), () => stripId(a)); } return; }
  if (ds.draft) { S.draft[ds.draft] = el.value; if (ds.draft === 'angle') S.draft.angle_src = 'input'; return; }
  if (ds.brief) { const b = briefById(S.briefId); if (b) { b.ai = b.ai || {}; b.ai[ds.brief] = el.value; b.updated_at = now(); saveBrief(b); } return; }
  const p = S.packs[S.briefId];
  if (ds.pack && p) { p.data[ds.pack] = ds.pack === 'hashtags' ? el.value.split(/\s+/).filter(Boolean) : el.value; savePack(p); return; }
  if (ds.ad && p) { p.data.ad = p.data.ad || {}; p.data.ad[ds.ad] = el.value; savePack(p); const cnt = el.closest('div').querySelector('.counter'); if (cnt) { const max = {primary_text:125, headline:40, description:30}[ds.ad]; const n = [...el.value].length; cnt.textContent = `${n}/${max}`; cnt.classList.toggle('over', n > max); } return; }
  if (ds.slidef && p) { const s = packSlides(p)[+ds.i]; if (s) { s[ds.slidef] = el.value; savePack(p); redrawLater(); } return; }
  if (ds.ov && p) { const a = adSpec(p); p.overlay = p.overlay || {title: a.title, sub: a.sub}; p.overlay[ds.ov] = el.value; savePack(p); redrawLater(); return; }
  if (ds.cover && p) { const c = coverSpec(p); const fi = finalOf(p, 'image'); p.cover = p.cover || {title: c.title, bg: (fi && fi.cover && fi.cover.bg) || null}; p.cover.title = el.value; savePack(p); redrawLater(); return; }
  if (ds.scenecap && p) { const src = sceneSource(p); const s = src.list[+ds.scenecap]; if (s) { s[src.key] = el.value; savePack(p); redrawLater(); } return; }
  if (ds.packnote && p) { p.regen_note = el.value; savePack(p); return; }
  if (ds.rv) { S.reviewDraft[ds.rv] = el.value; return; }
  if (ds.pub) { const q = S.packs[ds.pub]; if (!q || el.type === 'checkbox') return; q.publish = q.publish || {metrics:{}}; q.publish.metrics = q.publish.metrics || {};
    if (ds.metric) q.publish.metrics[ds.metric] = el.value === '' ? '' : Math.max(0, +el.value);
    else if (ds.pf && ds.pf !== 'posted') q.publish[ds.pf] = el.value;
    q.updated_at = now(); saveLater(P.pack(S.wsId, q.id), () => stripId(q)); return; }
});
document.addEventListener('change', e => {
  const el = e.target; const ds = el.dataset;
  if (ds.change === 'selectWs') { selectWs(el.value); return; }
  if (ds.change === 'cfPick') { ACT.cfPickSlug(el.value); return; }
  if (ds.change === 'studioBrief') { S.briefId = el.value; S.packTab = 'text'; render(); return; }
  if (ds.slidebg) { const p = S.packs[S.briefId]; const s = packSlides(p)[+ds.slidebg]; if (s) { s.bg = el.value === 'brand' ? 'brand' : el.value; touchPack(p); render(); } return; }
  if (ds.adbg) { const p = S.packs[S.briefId]; const a = adSpec(p); p.overlay = p.overlay || {title: a.title, sub: a.sub}; const as = el.value.startsWith('asset:') ? findAsset(el.value) : null;
    p.bg = as ? as.asset_id : null; p.overlay_bg_manual = true; if (!as) { const fi = finalOf(p, 'image'); if (fi) { fi.ad = Object.assign({}, fi.ad || {}, {bg: el.value}); } } touchPack(p); render(); return; }
  if (ds.coverbg) { const p = S.packs[S.briefId]; const c = coverSpec(p); p.cover = p.cover || {title: c.title}; p.cover.bg = el.value; touchPack(p); render(); return; }
  if (ds.import) { const f = el.files[0]; el.value = ''; if (!f) return; f.text().then(t => { try { const d = JSON.parse(t); if (d.kind !== 'cofounder-marketing-studio-backup' || !d.workspace) throw 0; S.importData = d; render(); } catch (e) { toast('이 스튜디오의 백업 파일이 아닙니다', 'err'); } }); return; }
  if (ds.change === 'bgAsset' || ds.change === 'imgBg') { const p = S.packs[S.briefId]; p.bg = el.value || null; touchPack(p); render(); return; }
  if (ds.asset && ds.afield === 'type') { const a = S.assets.find(x => x.id === ds.asset); if (a) { a.type = el.value; saveDoc(P.asset(S.wsId, a.id), stripId(a)); render(); } return; }
  if (ds.cfsel) { S.cf.sel[ds.cfsel] = el.checked; const n = Object.values(S.cf.sel).filter(Boolean).length; if (n > 10) { el.checked = false; S.cf.sel[ds.cfsel] = false; toast('한 번에 10개까지 고를 수 있습니다', 'err'); } render(); return; }
  if (ds.upload) { uploadFiles([...el.files]); el.value = ''; return; }
  if (ds.aiimg) { if (el.files[0]) uploadAiImage(el.files[0]); el.value = ''; return; }
  if (ds.pub && ds.pf === 'posted') { const q = S.packs[ds.pub]; q.publish = q.publish || {metrics:{}}; q.publish.posted = el.checked; if (el.checked && !q.publish.date) q.publish.date = new Date().toISOString().slice(0, 10); q.updated_at = now(); saveDoc(P.pack(S.wsId, q.id), stripId(q)); render(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.addkey) { e.preventDefault(); ACT.listAdd({dataset:{key: e.target.dataset.addkey}}); }
});

/* ============================ boot ============================ */
async function boot(){
  render();
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, sample, assets, downloads, mcp] = await Promise.all([use('db'), use('sample'), use('assets'), use('downloads'), use('mcp')]);
  S.caps = {db, sample, assets, downloads, mcp};
  if (!db) { S.booted = true; render(); return; }
  db.collection('workspaces').onSnapshot(q => {
    const list = q.docs.map(d => ({id: d.id, ...clone(d.data())})).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    if (S.wsId && isDirty(P.ws(S.wsId))) { const mine = S.ws; S.workspaces = list.map(w => w.id === S.wsId && mine ? mine : w); }
    else { S.workspaces = list; if (S.wsId) S.ws = list.find(w => w.id === S.wsId) || S.ws; }
    if (!S.wsId && list.length) { const last = lsGet('mk_ws'); selectWs(list.some(w => w.id === last) ? last : list[0].id); return; }
    S.booted = true; render();
  }, () => { S.booted = true; render(); });
}
boot();
